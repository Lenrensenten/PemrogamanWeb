<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="todo-container">
    <div class="input-container">
      <input type="text" id="todo-input" placeholder="Tambahkan list baru...">
      <button onclick="addTodo()">Add</button>
    </div>
    <ul id="todo-list"></ul>
  </div>
  <script>
    function addTodo() {
      const input = document.getElementById("todo-input");
      const todoText = input.value.trim();

      if (todoText !== "") {
        const ul = document.getElementById("todo-list");
        const li = document.createElement("li");

        const textSpan = document.createElement("span");
        textSpan.classList.add("text");
        textSpan.textContent = todoText;

        const editBtn = document.createElement("button");
        editBtn.classList.add("edit-btn");
        editBtn.innerHTML = '<i class="fas fa-edit"></i>';
        editBtn.onclick = function() {
          
          const inputEdit = document.createElement("input");
          inputEdit.type = "text";
          inputEdit.value = textSpan.textContent;
          inputEdit.classList.add("edit-input");

          
          li.replaceChild(inputEdit, textSpan);
          inputEdit.focus();

          
          inputEdit.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
              const newText = inputEdit.value.trim();
              if (newText !== "") {
                textSpan.textContent = newText; 
                li.replaceChild(textSpan, inputEdit); 
              } else {
                li.removeChild(inputEdit); 
              }
            }
          });

          
          inputEdit.addEventListener("blur", function() {
            const newText = inputEdit.value.trim();
            if (newText !== "") {
              textSpan.textContent = newText; 
              li.replaceChild(textSpan, inputEdit); 
            } else {
              li.removeChild(inputEdit); 
            }
          });
        };

        const deleteBtn = document.createElement("button");
        deleteBtn.classList.add("delete-btn");
        deleteBtn.innerHTML = '<i class="fas fa-trash"></i>';
        deleteBtn.onclick = function() {
          ul.removeChild(li);
        };

        li.appendChild(textSpan);
        li.appendChild(editBtn); 
        li.appendChild(deleteBtn);
        ul.appendChild(li);

        input.value = "";
      }
    }
  </script>
</body>
</html>

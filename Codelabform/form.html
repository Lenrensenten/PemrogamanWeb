<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <form id="form-pendaftaran">
            <h2>Form Pendaftaran</h2>
            <div class="input-group">
                <label for="nama">Nama</label>
                <input type="text" id="nama" name="nama" required>
            </div>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="text" id="email" name="nama" required>
            </div>
            <div class="input-group">
                <label for="alamat">Alamat Lengkap</label>
                <input type="text" id="alamat" name="alamat" required>
            </div>
            <button class="button" id="button-daftar">Daftar</button>
        </form>
    </div>

    <script>
        document.getElementById('button-daftar').addEventListener("click", function(event){
            event.preventDefault();
            var nama = document.getElementById('nama').value;
            var email = document.getElementById('email').value;
            var alamat = document.getElementById('alamat').value;
            
            if(nama == ''||email==''||alamat==''){
                alert("NGGAK BOLEH KOSONG NYET")
            }else{
                
            }
        });
    </script>
    
</body>
</html>
